events {
    worker_connections 1024;
}

http {

    # WebSocket upgrade: pass "Connection: upgrade" only for upgrade requests,
    # "Connection: close" otherwise, so normal HTTP keep-alive is unaffected.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        server_name api.neuralnexus.site;

        ssl_certificate /etc/ssl/private/origin_cert.pem;
        ssl_certificate_key /etc/ssl/private/cloudflare_private.key;

        # Outbound relay socket from a user's local MCP daemon
        # (anubis-mcp-server-ubuntu). Long-lived; needs the WebSocket upgrade
        # headers and a generous read timeout so an idle-but-alive tunnel is not
        # torn down between tool calls.
        location /mcp/relay {
            proxy_pass http://langgraph-api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://langgraph-api:8000; # Assuming FastAPI runs on port 8000
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
