volumes:
    langgraph-data:
        driver: local
    grafana-storage:
        driver: local
    redis-data:
        driver: local
    # Shared whsec_ between stripe-cli and the API (local listen; not used in prod).
    stripe-webhook-secret:
        driver: local

services:
    redis:
        image: redis:7-alpine
        ports:
            - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    langgraph-api-dev:
        image: evdev3/anubis-langgraph-api:latest
        pull_policy: never
        dns:
            - 168.83.129.16
            - 8.8.8.8
        ports:
            - "${PORT:-8123}:${PORT:-8123}"
            - "${DEBUG_PORT:-5678}:${DEBUG_PORT:-5678}"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: python /api/healthcheck.py
            interval: 60s
            start_interval: 1s
            start_period: 10s
        env_file:
            - .env.dev
        environment:
            # Prefer Dashboard STRIPE_WEBHOOK_SECRET when set; otherwise the API
            # reads the secret written by the stripe-cli service into this file.
            STRIPE_WEBHOOK_SECRET_FILE: /run/stripe/webhook_secret
            # Prefer STRIPE_BILLING_CONFIG_JSON when set; otherwise the API reads
            # the JSON written by the stripe-provision service into this file — no
            # JSON is ever pasted into .env.dev.
            STRIPE_BILLING_CONFIG_FILE: /run/stripe/billing_config.json
        depends_on:
            redis:
                condition: service_healthy
            # Block API startup until provisioning has written billing_config.json,
            # so the billing config (loaded once at lifespan) is present at boot
            # with no manual paste and no restart. Offline caveat: if provisioning
            # cannot reach Stripe it exits non-zero and the API will not start —
            # set STRIPE_BILLING_CONFIG_JSON directly (or remove this condition) to
            # run without provisioning.
            stripe-provision:
                condition: service_completed_successfully
        volumes:
            - .:/deps/anubis
            # Prefetched Hub weights (see ``ensure_huggingface_models_cached``); survives container restarts.
            - ~/.cache/huggingface:/root/.cache/huggingface
            - stripe-webhook-secret:/run/stripe

    # One-shot: idempotently create/reuse the Stripe meters, tier products, and
    # prices, then write the config JSON to the shared volume for the API to read.
    # Runs to completion on every `docker compose up` (the provisioning script is
    # idempotent — existing objects are matched and reused, not duplicated). Leave
    # STRIPE_BILLING_CONFIG_JSON empty in .env.dev — no manual JSON paste, ever.
    # Needs STRIPE_SECRET_KEY (from .env.dev); refuses live keys without --allow-live.
    stripe-provision:
        image: evdev3/anubis-langgraph-api:latest
        pull_policy: never
        env_file:
            - .env.dev
        environment:
            STRIPE_BILLING_CONFIG_FILE: /run/stripe/billing_config.json
            # scripts/ imports `src.anubis...`; put the repo root on the path.
            PYTHONPATH: /deps/anubis
        working_dir: /deps/anubis
        entrypoint: ["python", "scripts/provision_stripe_billing.py"]
        # One-shot: run once and exit; never restart.
        restart: "no"
        volumes:
            - .:/deps/anubis
            - stripe-webhook-secret:/run/stripe

    # Forwards Stripe *account* (not Connect) events to the API and publishes the
    # signing secret to the shared volume. Leave STRIPE_WEBHOOK_SECRET empty in
    # .env.dev — no manual whsec_ paste on each restart.
    #
    # Persistent Dashboard webhook: create under Developers → Webhooks →
    # "Your account" (NOT "Connect"), point at your public HTTPS /stripe/webhook,
    # then put that endpoint's signing secret in STRIPE_WEBHOOK_SECRET (prod .env).
    stripe-cli:
        image: stripe/stripe-cli:latest
        env_file:
            - .env.dev
        environment:
            STRIPE_WEBHOOK_SECRET_FILE: /run/stripe/webhook_secret
            # In-compose DNS name + container listen port (same as PORT in .env.dev).
            STRIPE_WEBHOOK_FORWARD_TO: http://langgraph-api-dev:${PORT:-8123}/stripe/webhook
        depends_on:
            langgraph-api-dev:
                condition: service_healthy
        volumes:
            - ./scripts/stripe_listen_entrypoint.sh:/entrypoint.sh:ro
            - stripe-webhook-secret:/run/stripe
        entrypoint: ["/bin/sh", "/entrypoint.sh"]
        restart: unless-stopped
