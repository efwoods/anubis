volumes:
    langgraph-data:
        driver: local
    grafana-storage:
        driver: local
    redis-data:
        driver: local
    # Billing config handoff: stripe-provision writes billing_config.json here and
    # langgraph-api-prod reads it via STRIPE_BILLING_CONFIG_FILE, so the JSON is
    # never pasted into .env by hand. Mirrors the same handoff in
    # docker-compose.yml. NOTE: this volume deliberately does NOT carry a
    # webhook secret — the dev stack's stripe-cli publishes an ephemeral whsec_
    # for local `stripe listen` forwarding, which has no production equivalent.
    # Production receives webhooks from Stripe's servers at a public URL, and a
    # registered endpoint's signing secret is returned only when the endpoint is
    # created, so STRIPE_WEBHOOK_SECRET stays an explicit value in .env.
    stripe-billing-config:
        driver: local

services:
    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

    langgraph-api-prod:
        image: evdev3/anubis-langgraph-api:latest
        pull_policy: never
        dns:
            - 168.83.129.16
            - 8.8.8.8
        ports:
            - "8124:8000"
        extra_hosts:
            - "host.docker.internal:host-gateway" 
        healthcheck:
            test: python /api/healthcheck.py
            interval: 60s
            start_interval: 1s
            start_period: 10s
        env_file:
            - .env
        environment:
            # Read the billing config from the file stripe-provision wrote rather
            # than a pasted STRIPE_BILLING_CONFIG_JSON. resolve_stripe_billing_config_json
            # gives the env var precedence over this file, so leave that variable
            # EMPTY in .env or it will silently shadow a freshly provisioned config.
            STRIPE_BILLING_CONFIG_FILE: /run/stripe/billing_config.json
        depends_on:
            redis:
                condition: service_healthy
            stripe-provision:
                # Fail loudly rather than start with no billing config and silently
                # treat paying customers as free tier. Trade-off: a Stripe outage at
                # boot blocks startup even though the previous config is still in the
                # volume. Billing correctness is worth more than that availability.
                condition: service_completed_successfully
        volumes:
            - .:/deps/anubis
            - stripe-billing-config:/run/stripe
            # Prefetched Hub weights (see ``ensure_huggingface_models_cached``); survives container restarts.
            - ~/.cache/huggingface:/root/.cache/huggingface
            # Prefetched NLTK corpora (see ``ensure_nltk_corpora_cached``). The base
            # image already bakes these into /usr/share/nltk_data, so this only has
            # to catch anything downloaded at runtime — a resource added to
            # NLTK_RESOURCES ahead of an image rebuild — and keep a container
            # recreate from re-downloading ~20 MB. /root/nltk_data is on nltk's
            # default search path, so no NLTK_DATA environment variable is needed.
            - ~/.cache/nltk_data:/root/nltk_data
    # One-shot: creates/reuses the Stripe meters, products, prices, and billing-portal
    # configuration for every tier, then writes the resulting id map to the shared
    # volume and exits. Idempotent — meters are matched by event_name, products by
    # the neural_nexus_tier/product_role/meter metadata triple, prices by lookup_key,
    # so a re-run reports "exists" for everything and emits identical JSON.
    #
    # --live is the whole difference from the dev variant: it points the script at
    # .env (sk_live_) instead of .env.dev (sk_test_), and the script refuses a key
    # that does not match the file it came from. Consequence worth knowing — every
    # `docker compose -f docker-compose-prod.yml up` performs writes against the LIVE
    # Stripe account. That is safe by idempotency, not by omission.
    #
    # Changing a price: edit the amount or allotment in tiers.py and re-run. Stripe
    # prices are immutable, so the script compares the live price against tiers.py
    # and, on a change, creates the replacement carrying the same lookup key and
    # archives the old one, then migrates live subscriptions onto it with no
    # proration. Do NOT bump PRICE_LOOKUP_KEY_VERSION to change a price — that
    # renames every lookup key and re-tags every product.
    stripe-provision:
        image: evdev3/anubis-langgraph-api:latest
        pull_policy: never
        env_file:
            - .env
        environment:
            STRIPE_BILLING_CONFIG_FILE: /run/stripe/billing_config.json
            # scripts/ imports `src.anubis...`; put the repo root on the path.
            PYTHONPATH: /deps/anubis
        working_dir: /deps/anubis
        entrypoint:
            ["python", "scripts/provision_stripe_billing.py", "--live"]
        # One-shot: run once and exit; never restart.
        restart: "no"
        volumes:
            - .:/deps/anubis
            - stripe-billing-config:/run/stripe

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3000:3000"
        extra_hosts:
            - "host.docker.internal:host-gateway" 
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            - GF_PROVISIONING_ENABLED_ENV_SUBST=true
        env_file:
            - .env
        volumes:
            - grafana-storage:/var/lib/grafana            
            - ./grafana/provisioning:/etc/grafana/provisioning        
        restart: unless-stopped
    
    prometheus:
        image: prom/prometheus:latest
        ports:
            - "9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
            - langgraph-api-prod
        restart: unless-stopped